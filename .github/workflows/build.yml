name: Build and test Java web app
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_password
          MYSQL_DATABASE: torneos
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate organized source layout
        shell: bash
        run: |
          set -euo pipefail
          for view in home bracket teams admin create match login register; do
            test -f "web/WEB-INF/views/arena/${view}.jsp"
          done
          # Los archivos históricos no deben quedar dentro del WAR.
          test ! -f web/WEB-INF/views/home.jsp
          test ! -f web/css/arena.css
          test ! -f web/js/arena.js
          test -f archive/legacy-ui/views/home.jsp
          test -f database/schema/torneos.sql
          test -f database/seeds/demo_20_equipos.sql
          test -f database/migrations/upgrade_match_simulations.sql
          test -f database/setup/usuario_aplicacion.sql
          test -f database/diagnostics/comprobaciones.sql
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Initialize MySQL schema
        run: docker exec -i "${{ job.services.mysql.id }}" mysql -uroot -pci_password < database/schema/torneos.sql
      - name: Verify database installer and 20-team demo seed
        shell: bash
        run: |
          set -euo pipefail
          python3 database/generar_instalador.py --check
          service="${{ job.services.mysql.id }}"
          mysql_root() { docker exec -i "$service" mysql -uroot -pci_password "$@"; }
          verify_seed() {
            read -r total approved pending <<< "$(mysql_root -N -e "SELECT COUNT(*), SUM(status='APROBADO'), SUM(status='PENDIENTE') FROM torneos.teams")"
            test "$total" = "20"
            test "$approved" = "16"
            test "$pending" = "4"
          }
          # Validar semilla independiente e idempotencia.
          mysql_root < database/seeds/demo_20_equipos.sql >/dev/null
          verify_seed
          mysql_root < database/seeds/demo_20_equipos.sql >/dev/null
          verify_seed
          # El instalador único también debe funcionar sobre una base vacía.
          mysql_root -e "DROP DATABASE torneos"
          mysql_root < database/instalacion_completa_2026.sql >/dev/null
          verify_seed
          # La migración de modo en vivo se puede reejecutar sin borrar datos.
          mysql_root < database/migrations/upgrade_live_tournaments.sql >/dev/null
          mysql_root < database/migrations/upgrade_live_tournaments.sql >/dev/null
          # Validar el SQL de creación del usuario restringido en CI.
          mysql_root < database/setup/usuario_aplicacion.sql >/dev/null
          mysql_root -e "SHOW GRANTS FOR 'torneos_app'@'localhost'" >/dev/null
          # La prueba JUnit de 16 equipos requiere esquema sin equipos previos.
          mysql_root -e "DROP DATABASE torneos"
          mysql_root < database/schema/torneos.sql >/dev/null

      - name: Check spectator privacy and frontend JavaScript syntax
        shell: bash
        run: |
          node --check web/js/stitch-runtime.js
          node --check web/js/arena-pitch.js
          node scripts/test-stitch-selectors.cjs
          node scripts/test-mobile-bracket.cjs
          node scripts/test-pitch.cjs
          test -f web/WEB-INF/views/arena/partials/header.jspf
          ! grep -R -q 'SERVIDORES ONLINE' web/WEB-INF/views/arena/
          grep -q 'arena-nav-current' web/WEB-INF/views/arena/partials/header.jspf
          grep -q 'data-arena-shell="2026-11-26-tactics-r5"' web/WEB-INF/views/arena/partials/header.jspf
          grep -q 'arenaHeaderUser.admin()' web/WEB-INF/views/arena/partials/header.jspf
      - name: Compile, test and package
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/torneos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USER: root
          DB_PASSWORD: ci_password
          RUN_DB_TESTS: 'true'
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Check WAR
        run: test -f target/BracketArena.war
      - name: Deploy WAR and smoke-test JSP in Tomcat 11
        run: |
          set -ex
          docker run -d --rm --name bracket-arena-smoke --network host \
            -e 'DB_URL=jdbc:mysql://127.0.0.1:3306/torneos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC' \
            -e 'DB_USER=root' -e 'DB_PASSWORD=ci_password' \
            -v "${PWD}/target/BracketArena.war:/usr/local/tomcat/webapps/BracketArena.war:ro" \
            tomcat:11.0-jdk21-temurin
          trap 'docker logs bracket-arena-smoke || true; docker stop bracket-arena-smoke || true' EXIT
          base='http://127.0.0.1:8080/BracketArena/app'
          ready=0
          for n in $(seq 1 60); do
            if curl -fsS "$base?view=inicio" -o /tmp/bracket-home.html 2>/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = "1"
          echo 'STITCH TEST: homepage headline'
          grep -q 'LA GRAN FINAL NACIONAL' /tmp/bracket-home.html
          # El encabezado compartido y las JSP deben producir bytes UTF-8 reales.
          curl -fsS -D /tmp/arena-html-headers.txt "$base?view=login" -o /tmp/arena-login-utf8.html
          python3 - <<'PY'
          from pathlib import Path
          header = Path("/tmp/arena-html-headers.txt").read_text(encoding="latin-1")
          page = Path("/tmp/arena-login-utf8.html").read_bytes().decode("utf-8")
          home = Path("/tmp/bracket-home.html").read_bytes().decode("utf-8")
          assert "charset=utf-8" in header.lower(), header
          assert "INICIAR SESIÓN" in page, "JSP principal no muestra la tilde correctamente"
          assert "Iniciar sesión" in page, "La inclusión del JSPF tiene caracteres dañados"
          assert "información y las estadísticas" in home, "La Ñ/tildes del encabezado fallan"
          for mojibake in ("SESIÃ", "informaciÃ", "Â", "\ufffd"):
              assert mojibake not in page and mojibake not in home, mojibake
          PY
          # HTML servido por la versión correcta (no basta comprobar las fuentes del repo).
          curl -fsS -D /tmp/arena-response-headers.txt "$base?view=inicio" -o /tmp/bracket-home.html
          grep -qi '^X-Bracket-Arena-UI: 2026-11-26-tactics-r5' /tmp/arena-response-headers.txt
          grep -q 'data-arena-shell="2026-11-26-tactics-r5"' /tmp/bracket-home.html
          grep -q 'stitch-runtime.js?v=2026-11-26-tactics-r5' /tmp/bracket-home.html
          sed -n '/<header /,/<\/header>/p' /tmp/bracket-home.html > /tmp/arena-rendered-header.html
          if grep -Eqi 'DATOS ACTUALIZADOS|SIN INICIAR SESI|SERVIDORES ONLINE|Alex Mercer|<select' /tmp/arena-rendered-header.html; then
            echo 'Se detectó el encabezado antiguo en HTML publicado:'
            cat /tmp/arena-rendered-header.html
            exit 1
          fi
          # El atributo es estable aunque Tomcat normalice caracteres HTML.
          if ! grep -q 'data-arena-login' /tmp/bracket-home.html; then
            echo 'Encabezado de visitante no visible:'
            head -c 3500 /tmp/bracket-home.html
            exit 1
          fi
          ! grep -q '/app?view=admin' /tmp/bracket-home.html
          ! grep -q 'SERVIDORES ONLINE' /tmp/bracket-home.html
          for page in equipos login registro cuadro; do
            curl -fsS "$base?view=$page" -o "/tmp/bracket-$page.html"
          done
          curl -fsS -c /tmp/bracket-cookies -b /tmp/bracket-cookies "$base?view=login" -o /tmp/bracket-login.html
          echo 'STITCH TEST: find server-side CSRF'
          grep -oE '.{0,30}name="csrf".{0,120}' /tmp/bracket-login.html | head -1 || true
          csrf=$(grep -o 'name="csrf" value="[^"]*"' /tmp/bracket-login.html | head -1 | cut -d '"' -f4)
          test -n "$csrf"
          curl -fsSL -c /tmp/bracket-cookies -b /tmp/bracket-cookies \
            --data-urlencode "csrf=$csrf" \
            --data-urlencode "action=login" \
            --data-urlencode "email=admin@torneo.local" \
            --data-urlencode "password=AdminExamen2026!" \
            "$base" -o /tmp/bracket-authenticated.html
          echo 'STITCH TEST: login success'
          grep -q 'Bienvenido' /tmp/bracket-authenticated.html
          curl -fsS -b /tmp/bracket-cookies "$base?view=admin" -o /tmp/bracket-admin.html
          echo 'STITCH TEST: admin panel'
          grep -q 'Gestor de Inscripciones y Solicitudes' /tmp/bracket-admin.html
          grep -q '/app?view=admin' /tmp/bracket-admin.html
          python3 - <<'PY'
          from pathlib import Path
          page = Path("/tmp/bracket-admin.html").read_bytes().decode("utf-8", errors="strict")
          assert "Administración" in page, "El encabezado administrativo perdió las tildes"
          assert "Gestor de Inscripciones y Solicitudes" in page
          for corrupted in ("ADMINISTRACIÃ", "SesiÃ", "Â", "\ufffd"):
              assert corrupted not in page, "Caracteres dañados: " + corrupted
          PY

      - name: Smoke-test public match report with statistics
        run: |
          base='http://127.0.0.1:8080/BracketArena/app'
          # El paso anterior ya detuvo Tomcat, reutilizamos otro contenedor de prueba.
          docker run -d --rm --name bracket-arena-report --network host \
            -e 'DB_URL=jdbc:mysql://127.0.0.1:3306/torneos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC' \
            -e 'DB_USER=root' -e 'DB_PASSWORD=ci_password' \
            -v "${PWD}/target/BracketArena.war:/usr/local/tomcat/webapps/BracketArena.war:ro" \
            tomcat:11.0-jdk21-temurin
          trap 'docker logs bracket-arena-report || true; docker stop bracket-arena-report || true' EXIT
          ready=0
          for n in $(seq 1 60); do
            if curl -fsS "$base?view=inicio" -o /tmp/bracket-main-report.html 2>/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = "1"
          curl -fsS 'http://127.0.0.1:8080/BracketArena/arena-data' -o /tmp/stitch-public-report.json
          match_id=$(python3 -c 'import json; d=json.load(open("/tmp/stitch-public-report.json")); print(next((str(m["id"]) for m in d["matches"] if m["done"]), ""))')
          test -n "$match_id"
          curl -fsS "$base?view=partido&id=$match_id" -o /tmp/partido-report.html
          grep -q 'Posesión de Balón' /tmp/partido-report.html
          grep -q 'Primer Tiempo' /tmp/partido-report.html
          grep -q 'Segundo Tiempo' /tmp/partido-report.html
          grep -q 'Estadísticas Finales' /tmp/partido-report.html
          grep -q 'id="arena-pitch"' /tmp/partido-report.html
          grep -q 'id="arena-event-markers"' /tmp/partido-report.html
          grep -q 'arena-pitch.js?v=2026-11-26-tactics-r5' /tmp/partido-report.html

      - name: Smoke-test dynamic JSON endpoint and local Stitch assets
        run: |
          docker run -d --rm --name bracket-stitch-smoke --network host \
            -e 'DB_URL=jdbc:mysql://127.0.0.1:3306/torneos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC' \
            -e 'DB_USER=root' -e 'DB_PASSWORD=ci_password' \
            -v "${PWD}/target/BracketArena.war:/usr/local/tomcat/webapps/BracketArena.war:ro" tomcat:11.0-jdk21-temurin
          trap 'docker stop bracket-stitch-smoke || true' EXIT
          base='http://127.0.0.1:8080/BracketArena'
          for n in $(seq 1 60); do
            if curl -fsS "$base/app?view=inicio" -o /tmp/stitch-home.html 2>/dev/null; then break; fi
            sleep 2
          done
          curl -fsS "$base/arena-data" -o /tmp/stitch-json
          grep -q '"ok":true' /tmp/stitch-json
          grep -q '"matches":' /tmp/stitch-json
          grep -q '"scorers":' /tmp/stitch-json
          curl -fsS "$base/css/stitch.css" -o /tmp/stitch-css
          grep -q '.bg-surface' /tmp/stitch-css
          curl -fsS "$base/js/stitch-runtime.js" -o /tmp/stitch-js
          curl -fsS "$base/js/arena-pitch.js" -o /tmp/arena-pitch-js
          grep -q 'window.ArenaPitch' /tmp/arena-pitch-js
          grep -q 'renderMobileBracket' /tmp/stitch-js
          grep -q 'arena-loading' /tmp/stitch-home.html
          grep -q 'src="/BracketArena/js/stitch-runtime.js?v=2026-11-26-tactics-r5"' /tmp/stitch-home.html
          curl -fsS "$base/app?view=cuadro" -o /tmp/stitch-bracket.html
          grep -q 'bracket-stage' /tmp/stitch-bracket.html
          curl -fsS "$base/app?view=equipos" -o /tmp/stitch-teams.html
          grep -q 'arena-team-form' /tmp/stitch-teams.html
          # Reproducir un equipo instalado con esquema antiguo: falta la
          # tabla nueva. El resto del tablero debe seguir consultando MySQL.
          db_service="${{ job.services.mysql.id }}"
          docker exec "$db_service" mysql -uroot -pci_password \
            -e 'DROP TABLE torneos.tournament_live_runs'
          curl -fsS "$base/arena-data" -o /tmp/stitch-without-live-table.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("/tmp/stitch-without-live-table.json").read_text())
          assert data["ok"] is True, data
          assert isinstance(data["teams"], list)
          assert data["live"]["migrationRequired"] is True, data["live"]
          PY
          docker exec -i "$db_service" mysql -uroot -pci_password \
            < database/migrations/upgrade_live_tournaments.sql
          curl -fsS "$base/arena-data" -o /tmp/stitch-after-upgrade.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("/tmp/stitch-after-upgrade.json").read_text())
          assert data["ok"] is True, data
          assert not data["live"].get("migrationRequired"), data["live"]
          PY
