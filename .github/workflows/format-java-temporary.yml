name: Temporary Java formatter for refactor
on:
  push:
    branches: [refactor/estructura-comentarios-y-formato]
    paths: ['.github/workflows/format-java-temporary.yml']
permissions:
  contents: write
jobs:
  java-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/estructura-comentarios-y-formato
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply Google Java Format (AOSP 4 spaces)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            'https://github.com/google/google-java-format/releases/download/v1.24.0/google-java-format-1.24.0-all-deps.jar' \
            -o /tmp/google-java-format.jar
          java -jar /tmp/google-java-format.jar --aosp --replace \
            src/java/com/torneo/*.java test/com/torneo/*.java
      - name: Commit formatted Java sources
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/java/com/torneo test/com/torneo
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply Google Java Format (AOSP 4-space)'
            git push origin HEAD:refactor/estructura-comentarios-y-formato
          fi
