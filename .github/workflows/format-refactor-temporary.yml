name: Temporary UI formatter for refactor
on:
  push:
    branches: [refactor/estructura-comentarios-y-formato]
    paths: ['.github/workflows/format-refactor-temporary.yml']
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/estructura-comentarios-y-formato
          persist-credentials: true
      - name: Apply reproducible formatting to authored JS and CSS
        run: |
          set -euo pipefail
          npx --yes prettier@3.6.2 --write web/js/stitch-runtime.js web/css/stitch-bridge.css
      - name: Commit formatting to the same PR
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/js/stitch-runtime.js web/css/stitch-bridge.css
          if ! git diff --cached --quiet; then
            git commit -m 'style: format authored frontend JS and CSS with Prettier'
            git push origin HEAD:refactor/estructura-comentarios-y-formato
          fi
